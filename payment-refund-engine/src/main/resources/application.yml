server:
  port: 8080

spring:
  application:
    name: payment-refund-engine

  datasource:
    url: jdbc:h2:mem:refunddb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.reintegros: DEBUG
    org.springframework.transaction: TRACE
